# Adapted from https://github.com/nlsfi/pinta/blob/main/.github/actions/release-component/action.yml

name: Release component
description: >
  Release one component with python-semantic-release and publish it to PyPI. After a release,
  the version requirements of the components that depend on it are raised in a build(deps)
  commit, so the dependents get released as well.

inputs:
  component:
    description: Component directory name under components/.
    required: true
  github_token:
    description: Token used to push release commits and tags.
    required: true

outputs:
  released:
    description: '"true" if the component was released.'
    value: ${{ steps.release.outputs.released }}

runs:
  using: composite
  steps:
    - name: Release ${{ inputs.component }}
      id: release
      uses: python-semantic-release/python-semantic-release@v10.5.3
      with:
        directory: components/${{ inputs.component }}
        github_token: ${{ inputs.github_token }}
        vcs_release: false

    # Publish right away so that dependents are never released before their dependencies
    - name: Publish package (dry run)
      if: steps.release.outputs.released == 'true'
      shell: bash
      working-directory: components/${{ inputs.component }}
      run: uv publish --dry-run dist/*
    - name: Publish package
      if: steps.release.outputs.released == 'true'
      shell: bash
      working-directory: components/${{ inputs.component }}
      run: uv publish dist/*

    # One build(deps) commit per dependent, the changed path makes it releasable for that dependent only
    - name: Raise version requirements of dependents
      if: steps.release.outputs.released == 'true'
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        git config user.name "semantic-release"
        git config user.email "semantic-release"
        # A separate assignment, so that set -e stops on a failing script
        dependents=$(python3 scripts/bump_dependents.py "$COMPONENT" "$VERSION")
        for dependent in $dependents; do
          uv lock
          git add "components/$dependent/pyproject.toml" uv.lock
          git commit -m "build(deps): require $COMPONENT >=$VERSION in $dependent"
        done
        git push
