name: E2E tests

on:
  push:
    branches: [ main ]
    paths:
      - 'components/qfield-driver/**'
      - 'components/pytest-qfield-e2e/**'
      - 'components/qfield-mcp/**'
      - 'components/qfield-fetch/**'
      - '.github/actions/setup-qfield-e2e/**'
      - 'components/pytest-qfield/test/data/**'
      - '.github/workflows/e2e-tests.yml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/qfield-driver/**'
      - 'components/pytest-qfield-e2e/**'
      - 'components/qfield-mcp/**'
      - 'components/qfield-fetch/**'
      - '.github/actions/setup-qfield-e2e/**'
      - 'components/pytest-qfield/test/data/**'
      - '.github/workflows/e2e-tests.yml'
      - 'uv.lock'
  schedule:
    # Catch a new QField release that breaks the `latest` tests early.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        qfield-version: ["4.2.9", "latest"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-qfield-e2e
        with:
          qfield-version: ${{ matrix.qfield-version }}
      - name: Run driver tests
        run: uv run --package qfield-driver --all-extras --all-groups pytest -v components/qfield-driver/test
      - name: Run e2e tests
        run: uv run --package pytest-qfield-e2e --all-extras --all-groups pytest -v -m "not qfieldcloud" components/pytest-qfield-e2e/test
      - name: Run MCP tests
        run: uv run --package qfield-mcp --all-extras --all-groups pytest -v components/qfield-mcp/test
