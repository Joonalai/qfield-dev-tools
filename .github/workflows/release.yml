# Inspired by https://github.com/nlsfi/pinta/blob/main/.github/workflows/release.yml

name: Release & publish
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build release packages without publishing them
        required: false
        default: true
        type: boolean

# Queue runs, each release pushes to main and a later run must see it
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Components are released one after another in dependency order in a single job,
  # because each release pushes a commit to the same branch. A component is released
  # when commits touching it include feat, fix or build commits.
  release:
    name: Release components
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Release Python packages
        uses: nlsfi/python-monorepo-release-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ inputs.dry_run }}
