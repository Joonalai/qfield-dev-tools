# Inspired by https://github.com/nlsfi/pinta/blob/main/.github/workflows/release.yml

name: Release & publish
on:
  push:
    branches:
      - main

# Queue runs, each release pushes to main and a later run must see it
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Components are released one after another in dependency order in a single job,
  # because each release pushes a commit to the same branch. A component is released
  # when commits touching it include feat, fix or build commits.
  release:
    name: Release components
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Release qfield-fetch
        uses: ./.github/actions/release-component
        with:
          component: qfield-fetch
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release pytest-qfield
        uses: ./.github/actions/release-component
        with:
          component: pytest-qfield
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release qfield-driver
        uses: ./.github/actions/release-component
        with:
          component: qfield-driver
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release pytest-qfield-e2e
        uses: ./.github/actions/release-component
        with:
          component: pytest-qfield-e2e
          github_token: ${{ secrets.GITHUB_TOKEN }}
