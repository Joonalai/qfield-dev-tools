name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'components/pytest-qfield/**'
      - '.github/actions/setup-pytest-qfield/**'
      - 'components/qfield-fetch/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/pytest-qfield/**'
      - '.github/actions/setup-pytest-qfield/**'
      - 'components/qfield-fetch/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'uv.lock'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: |
          uv sync --package qfield-fetch --all-groups
          uv run --package qfield-fetch pytest -v -c components/qfield-fetch/pyproject.toml components/qfield-fetch/test

  pytest:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        qgis-image-tags: ["4.2-questing", "latest"]
        qfield-refs: ["v4.2.9", "release-4_3", "master"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pytest-qfield
        with:
          install: uv sync --package pytest-qfield --all-groups
          qfield-version: ${{ matrix.qfield-refs }}

      - name: Run tests
        run: |
          uv run --package pytest-qfield pytest -v --qgis_disable_gui components/pytest-qfield/test
