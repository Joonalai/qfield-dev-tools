name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'components/pytest-qfield/**'
      - 'components/qfield-fetch/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/pytest-qfield/**'
      - 'components/qfield-fetch/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
      - 'uv.lock'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: |
          uv sync --package qfield-fetch --all-groups
          uv run --package qfield-fetch pytest -v -c components/qfield-fetch/pyproject.toml components/qfield-fetch/test

  pytest:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        qgis-image-tags: ["4.2-questing", "latest"]
        qfield-refs: ["v4.2.9", "release-4_3", "master"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install venv
        run: |
          apt update
          apt install -y python3-venv curl git

      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip3 install -q -U uv
          .venv/bin/uv sync --package pytest-qfield --all-groups
          # The system PyQt6 lacks QML bindings and the PyQt6 wheel must bundle
          # the same Qt minor version as the system, as QGIS uses its private API
          QT_MINOR=$(python3 -c "from PyQt6.QtCore import QT_VERSION_STR; print(QT_VERSION_STR.rsplit('.', 1)[0])")
          .venv/bin/uv pip install --python .venv/bin/python "PyQt6==${QT_MINOR}.*"

      - name: Run tests
        env:
          QFIELD_VERSION: ${{ matrix.qfield-refs }}
          QGIS_IN_CI: 1
        run: |
          .venv/bin/uv run --package pytest-qfield pytest -v --qgis_disable_gui components/pytest-qfield/test
