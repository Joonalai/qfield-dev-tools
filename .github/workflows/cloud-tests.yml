name: Cloud tests

# The stack build is slow, so pull requests run it only when cloud code changes.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'components/qfield-driver/src/qfield_driver/cloud/**'
      - 'components/qfield-driver/src/qfield_driver/actions.py'
      - 'components/pytest-qfield-e2e/src/pytest_qfield_e2e/cloud.py'
      - 'components/pytest-qfield-e2e/test/conftest.py'
      - 'components/pytest-qfield-e2e/test/test_cloud.py'
      - 'components/qfield-fetch/src/**'
      - '.github/actions/setup-qfield-e2e/**'
      - '.github/workflows/cloud-tests.yml'
  schedule:
    # The stack follows app.qfield.cloud, catch a new QFieldCloud release early.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-qfield-e2e
      - name: Run cloud tests against the hosted QFieldCloud release
        run: >
          uv run --package pytest-qfield-e2e --all-extras --all-groups pytest -v
          -m qfieldcloud --qfieldcloud-down components/pytest-qfield-e2e/test
