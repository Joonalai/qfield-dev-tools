[project]
name = "pytest-qfield-e2e"
description = "Pytest fixtures for plugin and end-to-end tests on a real QField app"
readme = "README.md"
version = "0.2.0"
keywords = ["pytest", "QField", "QFieldCloud", "GIS", "e2e"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pytest>=8",
    "qfield-driver>=0.2.0,<0.3",
    "qfield-fetch",
]

[project.optional-dependencies]
cloud = ["qfield-driver[cloud]>=0.2.0,<0.3"]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[project.entry-points.pytest11]
pytest-qfield-e2e = "pytest_qfield_e2e.plugin"
pytest-qfield-e2e-cloud = "pytest_qfield_e2e.cloud"

[tool.uv.sources]
qfield-driver = { workspace = true }
qfield-fetch = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pytest_qfield_e2e"

[tool.pytest.ini_options]
# The QGIS based plugins import Qt on load, app tests need none of it.
addopts = "-p no:pytest-qfield -p no:pytest_qgis -p no:pytest-qt"
testpaths = ["test"]
log_cli_level = "INFO"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
tag_format = "pytest-qfield-e2e-v{version}"
commit_message = """\
chore(release): pytest-qfield-e2e {version}

Automatically generated by python-semantic-release
"""
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "e2e"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
mode = "update"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
