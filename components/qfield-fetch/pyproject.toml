[project]
name = "qfield-fetch"
description = "Download QField AppImages and QField and QFieldCloud sources into one cache"
readme = "README.md"
version = "0.1.0"
keywords = ["QField", "QFieldCloud", "GIS", "AppImage"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
]
dependencies = [
    "typer>=0.16",
]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[project.scripts]
qfield-fetch = "qfield_fetch.cli:app"
qff = "qfield_fetch.cli:app"

[project.entry-points.pytest11]
qfield-fetch = "qfield_fetch.pytest_plugin"

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qfield_fetch"

[tool.pytest.ini_options]
# The QGIS based plugins import Qt on load, these tests need none of it.
addopts = "-p no:pytest-qfield -p no:pytest_qgis -p no:pytest-qt"
testpaths = ["test"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
tag_format = "qfield-fetch-v{version}"
commit_message = """\
chore(release): qfield-fetch {version}

Automatically generated by python-semantic-release
"""
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "fetch"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
mode = "update"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
