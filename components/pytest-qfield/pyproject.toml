[project]
name = "pytest-qfield"
description = "A pytest plugin for testing QField qml plugins"
readme = "README.md"
version = "0.11.1"
keywords = ["pytest", "QField", "GIS"]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest-qt",
    "pytest-qgis>=3.0.1",
]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pytest_qfield"
include = ["**/py.typed", "**/*.qml"]

[project.entry-points.pytest11]
pytest-qfield = "pytest_qfield.plugin"

[tool.pytest.ini_options]
doctest_encoding = "utf-8"
env_files = [".env"]
testpaths = ["test"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
# Tags predate the monorepo, keep them unprefixed
tag_format = "v{version}"
commit_message = """\
chore(release): pytest-qfield {version}

Automatically generated by python-semantic-release
"""
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
# Commits before the monorepo touched other paths, so init mode would drop them
mode = "update"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
