[project]
name = "pytest-qfield"
description = "A pytest plugin for testing QField qml plugins"
readme = "README.md"
version = "0.11.0"
keywords = ["pytest", "QField", "GIS"]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest-qt",
    "pytest-qgis>=3.0.1",
]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pytest_qfield"
include = ["**/py.typed", "**/*.qml"]

[project.entry-points.pytest11]
pytest-qfield = "pytest_qfield.plugin"

[tool.pytest.ini_options]
doctest_encoding = "utf-8"
env_files = [".env"]
testpaths = ["test"]

[tool.semantic_release]
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
commit_message = """\
chore(release): {version}

Automatically generated by python-semantic-release
"""
build_command = """
    python -m pip install uv==0.10.9
    uv lock
    git add ../../uv.lock
    uv build --out-dir ../../dist
"""

[tool.semantic_release.changelog]
mode = "init"
# Recommended patterns for conventional commits parser that is scope aware
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
