[project]
name = "qfield-mcp"
description = "MCP server driving a real QField app, for agents exploring and testing plugins"
readme = "README.md"
version = "0.1.1"
keywords = ["QField", "MCP", "GIS"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "qfield-driver[cloud]>=0.1.1,<0.2",
    "qfield-fetch",
]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[project.scripts]
qfield-mcp = "qfield_mcp.server:main"

[tool.uv.sources]
qfield-driver = { workspace = true }
qfield-fetch = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qfield_mcp"

[tool.pytest.ini_options]
addopts = "-p no:pytest-qfield -p no:pytest_qgis -p no:pytest-qt"
testpaths = ["test"]
markers = ["qfield_app: test runs a real QField app, Linux and Xvfb only"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
tag_format = "qfield-mcp-v{version}"
commit_message = """\
chore(release): qfield-mcp {version}

Automatically generated by python-semantic-release
"""
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "mcp"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
mode = "update"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
