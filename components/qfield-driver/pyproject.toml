[project]
name = "qfield-driver"
description = "Drive a real QField app from Python, with a local QFieldCloud"
readme = "README.md"
version = "0.1.0"
keywords = ["QField", "QFieldCloud", "GIS", "e2e"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "python-xlib>=0.33",
    "qfield-fetch",
]

[project.optional-dependencies]
cloud = ["requests>=2.32", "urllib3>=2", "typer>=0.16"]

[project.urls]
homepage = "https://github.com/Joonalai/qfield-dev-tools"
repository = "https://github.com/Joonalai/qfield-dev-tools"

[project.scripts]
qfield-driver-cloud = "qfield_driver.cloud.cli:app"
qfdc = "qfield_driver.cloud.cli:app"

[tool.uv.sources]
qfield-fetch = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qfield_driver"

[tool.pytest.ini_options]
# The QGIS based plugins import Qt on load, these tests need none of it.
addopts = "-p no:pytest-qfield -p no:pytest_qgis -p no:pytest-qt"
testpaths = ["test"]
markers = ["qfield_app: test runs a real QField app, Linux and Xvfb only"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
tag_format = "qfield-driver-v{version}"
commit_message = """\
chore(release): qfield-driver {version}

Automatically generated by python-semantic-release
"""
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "driver"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
mode = "update"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "dev"
