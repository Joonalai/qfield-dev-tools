default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [ "pre-commit" ]
      - id: end-of-file-fixer
        stages: [ "pre-commit" ]
      - id: mixed-line-ending
        name: LF for all files
        args: [ --fix=lf ]
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --extend-fixable=F401]
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e  # frozen: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-pyproject==1.2.4
          - flake8-qgis==2.1.0

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # frozen: v1.5.6
    hooks:
      - id: insert-license  # Insert a short license disclaimer as a header comment in source files
        files: \.py$
        args:
          - --license-filepath
          - copyright-header.txt
          - --use-current-year

  - repo: https://github.com/nlsfi/qgis-plugin-dev-tools
    rev: 5bedbcb39455262e5e1aed1e5ca5e9f14928799f  # frozen: v0.13.2
    hooks:
      - id: normalize-xml
        files: \.(xml|qml|ui|qgs)$
        args: [
          "--remove-tag", "ProjectGpsSettings",
          "--remove-tag", "properties"
        ]

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # frozen: v0.19.1
    hooks:
      - id: gitlint
        stages: [ "commit-msg" ]
