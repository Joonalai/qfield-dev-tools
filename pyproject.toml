[tool.uv.workspace]
members = ["components/*"]

[tool.uv]
default-groups = ["dev", "lint"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "pytest-cov",
    "pytest-dotenv",
    "pytest-subtests",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy",
    "prek",
    "ruff",
]

[tool.ruff]
line-length = 88
indent-width = 4
src = ["components/*/src", "components/*"]

target-version = "py310"

lint.select = [
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "C90", # flake8, mccabe
    "E", # flake8, pycodestyle
    "F", # flake8, Pyflakes
    "I", # isort
    "INP", # flake8-no-pep420
    "N", # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "PL", # pylint
    "PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T", # flake8-print
    "ICN", # flake8-import-conventions
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "W", # flake8, pycodestyle
    "UP", # pyupgrade
]

lint.unfixable = [
    "F401", # Unused imports
    "F841", # Unused variables
]

lint.external = ["QGS"]

[tool.ruff.lint.per-file-ignores]
"components/pytest-qfield/src/pytest_qfield/stub_interface/*" = ["N802", "N815"]
"components/pytest-qfield/src/pytest_qfield/qfield_resources.py" = ["N802", "ANN201", "INP"]
"components/*/test/*" = [
    "ANN001", # missing-type-function-argument
    "ANN201", # missing-return-type-undocumented-public-function
    "PLR2004", # magic-value-comparison
    "N802", # Function name should be lowercase
    "E501", # Line too long
]

[tool.flake8]
select = [
  "QGS",
]
ignore = ["QGS103"]
