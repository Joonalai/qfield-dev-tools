[tool.uv.workspace]
members = ["components/*"]

[tool.uv]
default-groups = ["dev", "lint"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "pytest-cov",
    "pytest-dotenv",
    "pytest-subtests",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy",
    "prek",
    "ruff",
]

[tool.ruff]
line-length = 88
indent-width = 4
src = ["components/*/src", "components/*"]

target-version = "py310"

lint.select = ["ALL"]

lint.ignore = [
    "COM812", # conflicts with the formatter
    "D1", # docstrings only where the code doesn't already say it
    "D203", # conflicts with D211
    "D213", # conflicts with D212
    "FIX002", # TODOs are allowed when they have an author (TD002)
    "TD003", # TODOs are not tracked as issues
]

lint.unfixable = [
    "F401", # Unused imports
    "F841", # Unused variables
]

lint.external = ["QGS"]

[tool.ruff.lint.per-file-ignores]
# Stubs mirror QField's C++ API, which QML calls positionally
"components/pytest-qfield/src/pytest_qfield/stub_interface/*" = [
    "FBT001",
    "FBT002",
    "N802",
    "N815",
]
"components/pytest-qfield/src/pytest_qfield/qfield_resources.py" = ["N802", "ANN201", "INP"]
"components/*/test/*" = [
    "ANN001", # missing-type-function-argument
    "ANN201", # missing-return-type-undocumented-public-function
    "PLR2004", # magic-value-comparison
    "N802", # Function name should be lowercase
    "E501", # Line too long
    "FBT003", # QML-facing APIs take positional booleans
    "S101", # assert
    "SLF001", # private-member-access
]

[tool.flake8]
select = [
  "QGS",
]
ignore = ["QGS103"]
